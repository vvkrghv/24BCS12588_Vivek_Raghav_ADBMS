{% extends "base.html" %}
{% block title %}Login{% endblock %}
{% block bare %}
<div class="login-bg">
  <div class="card login-card shadow-lg">
    <div class="card-body p-4">
      <div class="text-center mb-4">
        <i class="bi bi-buildings text-primary" style="font-size:2.5rem"></i>
        <h1 class="h4 mt-2 mb-0">Hostel Management System</h1>
        <p class="text-muted small">Sign in to continue</p>
      </div>
      {% include "_flash.html" %}
      <form method="post">
        <div class="mb-3">
          <label class="form-label">Username</label>
          <input name="username" class="form-control" required autofocus placeholder="Username or roll number">
        </div>
        <div class="mb-3">
          <label class="form-label">Password</label>
          <input name="password" type="password" class="form-control" required>
        </div>
        <button class="btn btn-primary w-100">Sign in</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
