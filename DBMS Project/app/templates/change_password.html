{% extends "base.html" %}
{% block title %}Change password{% endblock %}
{% block heading %}Change password{% endblock %}
{% block content %}
<div class="card" style="max-width:460px">
  <div class="card-body">
    <form method="post">
      <div class="mb-3"><label class="form-label">Current password</label>
        <input type="password" name="old" class="form-control" required></div>
      <div class="mb-3"><label class="form-label">New password</label>
        <input type="password" name="new" class="form-control" minlength="6" required></div>
      <div class="mb-3"><label class="form-label">Confirm new password</label>
        <input type="password" name="confirm" class="form-control" minlength="6" required></div>
      <button class="btn btn-primary">Update password</button>
    </form>
  </div>
</div>
{% endblock %}
